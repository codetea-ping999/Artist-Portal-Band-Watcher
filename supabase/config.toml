# Supabase CLI configuration for Artist Portal Band Watcher.
#
# The connected remote project. After cloning into another environment, replace
# this value with that project's reference before using the Supabase CLI.
#   supabase db push
#   supabase db seed
#   supabase functions deploy collect --no-verify-jwt
#
# This file intentionally keeps the initial setup lightweight so the
# repository can document the target state before the remote project exists.

project_id = "gvrzchxbnnxgaysadqdd"

[functions.collect]
verify_jwt = false
